<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — FinTrack Personal Finance</title>
  <meta name="description" content="Sign in to your FinTrack personal finance and savings management account.">
  <!-- Bootstrap 5.3 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Custom Style -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">

  <div class="container" style="max-width: 440px;">
    <!-- Brand Header -->
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center brand-icon mb-2" style="width: 44px; height: 44px; font-size: 1.25rem;">
        <i class="bi bi-wallet2"></i>
      </div>
      <h1 class="h4 fw-bold text-dark mb-1 tracking-tight">FinTrack</h1>
      <p class="text-secondary text-sm">Personal Finance &amp; Savings Management (INR / ₹)</p>
    </div>

    <!-- Login Card -->
    <div class="card-ft p-4 p-sm-5 bg-white">
      <h2 class="h5 fw-bold text-dark mb-1">Sign In to Your Account</h2>
      <p class="text-muted text-xs mb-4">Manage your monthly budgets, manual transactions, and savings goals.</p>

      <!-- Error Alert -->
      <div id="authErrorAlert" class="alert alert-danger text-xs py-2 px-3 d-none mb-3" role="alert"></div>

      <form id="loginForm">
        <div class="mb-3">
          <label for="loginEmail" class="form-label text-xs fw-semibold text-secondary">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light border text-muted"><i class="bi bi-envelope"></i></span>
            <input 
              type="email" 
              class="form-control form-control-ft" 
              id="loginEmail" 
              placeholder="rahul.sharma@fintrack.in" 
              required
            >
          </div>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="loginPassword" class="form-label text-xs fw-semibold text-secondary mb-0">Password</label>
            <span class="text-xs text-muted">Never stored in plaintext</span>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-light border text-muted"><i class="bi bi-lock"></i></span>
            <input 
              type="password" 
              class="form-control form-control-ft" 
              id="loginPassword" 
              placeholder="••••••••••••" 
              required
            >
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check text-xs">
            <input class="form-check-input" type="checkbox" id="rememberMe" checked>
            <label class="form-check-label text-secondary" for="rememberMe">Remember me</label>
          </div>
          <button type="button" id="demoFillBtn" class="btn btn-link text-primary text-xs p-0 text-decoration-none">
            <i class="bi bi-magic me-1"></i>Fill Demo Account
          </button>
        </div>

        <button type="submit" id="loginSubmitBtn" class="btn btn-ft-primary w-100 py-2">
          Sign In to FinTrack
        </button>
      </form>

      <div class="text-center border-top mt-4 pt-3 text-xs text-muted">
        Don't have an account yet? 
        <a href="register.html" class="text-primary fw-semibold text-decoration-none">Create Account</a>
      </div>
    </div>

    <!-- Security & Academic Note -->
    <div class="text-center mt-3 text-muted" style="font-size: 0.725rem;">
      <span>Protected by Spring Security BCrypt hashing · Indian Rupee (INR) standard</span>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
